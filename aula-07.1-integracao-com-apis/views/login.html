{% extends 'base.html' %}

{% block content %}
<div class="container col-4">
<div class="card mt-4">
    <div class="card-header">
        <h2> Login do Usuário</h2>
    </div>
 <div class="card-body m-auto">
 <form action="{{url_for('login')}} " method="POST">
    <label for="">Email</label>
    <input type="email" name="email" placeholder="Insira seu email" class="form-control" required>
    <input type="password" name="senha" placeholder="Insira sua senha" class="form-control" required>
    <button type="submit" class="btn btn-danger btn-block">Entrar</button>
 </form>
 <hr>
 <h6>Não possui conta? <a href="{{url_for('cadastro')}}">Cadastre-se!</a></h6>
 </div>
</div>
</div>
{% endblock content %}

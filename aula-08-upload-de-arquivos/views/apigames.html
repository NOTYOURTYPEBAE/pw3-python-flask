{%extends 'base.html'%}


{% block content%}

<div class="container"style='background-color: #f8f9fa;  border-radius: 8px; '>
    
<div class="row">

{% for jogo in listaJogos %}
<div class="col-md-3 m-auto">

<div class="card" style="width: 16rem;">
<img src="{{jogo.thumbnail}}" alt="Imagem do jogo">
<div class="card-body">
    
    <h5>{{jogo.title}}</h5>
    <p>{{jogo.genre}}</p>
    <p>{{jogo.platform}}</p>
    <!--Botões de mais informações-->
    <a href="{{url_for('apigames', id=jogo.id)}}" class="btn btn-dark" >+Info</a>
    <!--Botão de jogar-->
    <a href="{{jogo.game_url}}" class="btn btn-danger" target="_blank">Jogar</a>
</div>
</div>
</div>


{% endfor %}
</div>
</div>
{% endblock content %}

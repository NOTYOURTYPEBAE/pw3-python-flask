{% extends "base.html" %}
{% block content %}

{% with messages = get_flashed_messages(with_categories=true) %}

{% for category, message in messages %}
    <div class="alert alert-{{category}}">
        {{message}}
    </div>
{%endfor%}
{%endwith   %}

<h2 style="text-align: center;">Galeria de Fotos</h2>
<br>
<div class="container col-6">
    <div class="card mt-4">
        <div class="card-body">
            <!--Formulario-->
            <form action="{{url_for('galeria')}}" method="POST" enctype="multipart/form-data">
                <label for="file">Selecione um arquivo:</label>
                <input type="file" name="file" class="form-control" required>
                <br>
                <button type="submit" class="btn btn-danger btn-block">Fazer Upload</button>
            </form>
        </div>
    </div>
</div>

{%endblock content%}

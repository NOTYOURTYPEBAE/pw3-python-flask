<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .formulario {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            border: 2px solid #4a90e2;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 28px;
            border-bottom: 3px solid #4a90e2;
            padding-bottom: 10px;
        }
        
        .campo {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: bold;
            font-size: 16px;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f9f9f9;
            box-sizing: border-box;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            border-color: #4a90e2;
            background-color: white;
            box-shadow: 0 0 8px rgba(74,144,226,0.3);
            outline: none;
        }
        
        input:hover, select:hover {
            border-color: #7f8c8d;
            background-color: white;
        }
        
        .botao {
            width: 100%;
            padding: 14px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
            border-bottom: 4px solid #2980b9;
        }
        
        .botao:hover {
            background-color: #357abd;
            border-bottom-width: 2px;
            transform: translateY(2px);
        }
        
        .icone {
            font-size: 20px;
            margin-right: 5px;
        }
        
        .rodape {
            text-align: center;
            margin-top: 20px;
            color: #7f8c8d;
            font-size: 14px;
            border-top: 1px solid #ecf0f1;
            padding-top: 15px;
        }
        
        .obrigatorio {
            color: #e74c3c;
            font-size: 14px;
            margin-left: 5px;
        }
        
        .dica {
            font-size: 12px;
            color: #95a5a6;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="formulario">
        <h1>📖 Cadastro de Livro</h1>
        
        <form action="#" method="get">
            <div class="campo">
                <label>
                    <span class="icone">📕</span> 
                    Nome do Livro <span class="obrigatorio">*</span>
                </label>
                <input type="text" 
                       name="nome_livro" 
                       placeholder="Ex: Dom Casmurro, 1984, O Alquimista" 
                       required
                       maxlength="100">
                <div class="dica">Máximo de 100 caracteres</div>
            </div>
            
            <div class="campo">
                <label>
                    <span class="icone">🏷️</span> 
                    Gênero <span class="obrigatorio">*</span>
                </label>
                <select name="genero" required>
                    <option value="" disabled selected>Selecione o gênero literário</option>
                    <option value="romance">📚 Romance</option>
                    <option value="ficcao">🚀 Ficção Científica</option>
                    <option value="fantasia">🧙 Fantasia</option>
                    <option value="suspense">🔍 Suspense/Terror</option>
                    <option value="biografia">👤 Biografia</option>
                    <option value="historia">📜 História</option>
                    <option value="poesia">📝 Poesia</option>
                    <option value="infantil">🧸 Infantil</option>
                    <option value="autoajuda">💪 Autoajuda</option>
                    <option value="tecnico">💻 Técnico/Científico</option>
                    <option value="outro">❓ Outro</option>
                </select>
            </div>
            
            <div class="campo">
                <label>
                    <span class="icone">✍️</span> 
                    Autor(a) <span class="obrigatorio">*</span>
                </label>
                <input type="text" 
                       name="autor" 
                       placeholder="Ex: Machado de Assis, George Orwell" 
                       required
                       maxlength="80">
                <div class="dica">Nome completo do autor</div>
            </div>
            
            <button type="submit" class="botao">
                ✅ Cadastrar Livro
            </button>
            
            <div class="rodape">
              <a href="/lista" style="color: rgb(45, 69, 175); margin: 0 10px;">Livros listados</a>|<a href="/" style="color: rgb(45, 69, 175); margin: 0 10px;">Início</a> |    * Campos obrigatórios
            </div>
           
        </form>
    </div>
</body>
</html>

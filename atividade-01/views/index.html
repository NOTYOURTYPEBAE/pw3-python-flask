{%extends 'base.html'%}
{%block content%}
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Barra de navegação */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .menu {
            display: flex;
            gap: 25px;
        }
        
        .menu a {
            text-decoration: none;
            color: white;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .menu a:hover {
            background: white;
            color: #764ba2;
        }
        
        .menu a.ativo {
            background: white;
            color: #764ba2;
            font-weight: 600;
        }
        
        /* Conteúdo principal */
        .hero {
            text-align: center;
            padding: 100px 20px;
        }
        
        .hero h1 {
            font-size: 58px;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .hero h3 {
            font-size: 28px;
            margin: 0;
            font-weight: 300;
            opacity: 0.9;
        }
        
        /* Responsividade */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
            
            .menu {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .hero h1 {
                font-size: 36px;
            }
            
            .hero h3 {
                font-size: 22px;
            }
        }
    </style>

    <div class="container">
        <!-- Barra de navegação -->
        <div class="navbar">
            <a href="/" class="logo">
                <span>📚</span> MyBooks
            </a>
            <div class="menu">
                <a href="/" class="ativo">Home</a>
                <a href="/formulario">Cadastro</a>
                <a href="/lista">Biblioteca</a>
               
            </div>
        </div>

        <!-- Hero Section com nome do site -->
        <div class="hero">
            <h1>Bem-Vindos ao MyBooks</h1>
            <h3>O melhor site para baixar livros online!</h3>
        </div>
    </div>
{%endblock content%}

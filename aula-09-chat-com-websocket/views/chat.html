{%extends 'base.html'%}
{%block content%}

<div class="container">
    <h1 class="text-center">Chat com Jogadores</h1>
<hr>
<div class="chat" id="chat">
    <!-- aqui irao as mensagens -->
</div>
<hr>
<input type="text" id="msg" class="form-control" placeholder="Digite sua mensagem">
<!--Botao-->
<button class="btn btn-primary btn-lg w-100 mt-2" onclick="sendMsg()">Enviar</button>

</div>


<!-- Importação do Javascript do SocketIO -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>

<!-- Script de chat -->
<script>
    const nickname = "{{ nickname }}";
    const socket = io();

    socket.on("connect", () => {
        socket.emit("join", { nickname: nickname });
    });

    socket.on("join", data => {
        const chat = document.getElementById("chat");
        const p = document.createElement("p");
        p.innerHTML = `<strong>${data.nickname}</strong> entrou no chat.`;
        chat.append(p);
    });

    socket.on("showmsg", data => {
        const chat = document.getElementById("chat");
        const p = document.createElement("p");
        p.innerHTML = `<strong>${data.nickname}</strong>: ${data.msg}`;
        chat.append(p);
    });

    function sendMsg() {
        const msgInput = document.getElementById("msg");
        const sentMsg = msgInput.value;
        if (!sentMsg.trim()) return;
        socket.emit("msg", { msg: sentMsg, nickname: nickname });
        msgInput.value = "";
    }

    document.getElementById("msg").addEventListener("keypress", function (e) {
        if (e.key === "Enter") sendMsg();
    });
</script>

{%endblock content%}

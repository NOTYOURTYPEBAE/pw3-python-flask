<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyBooks - Sua Biblioteca Online</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background-color: #f8f9fa;
      }
      
      .main-content {
        flex: 1;
      }
      
      footer {
        background-color: #343a40;
        color: white;
        padding: 20px 0;
        text-align: center;
        margin-top: 40px;
      }
      
      footer p {
        margin: 0;
      }
      
      footer a {
        color: #8ab4f8;
        text-decoration: none;
      }
      
      footer a:hover {
        text-decoration: underline;
      }
      
      .navbar-brand {
        font-weight: bold;
        font-size: 1.5rem;
      }
      
      .navbar-brand i {
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
  
    <!-- NAVBAR SIMPLIFICADA -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('apilivros') }}">
          <i class="fas fa-book-open"></i> MyBooks
        </a>
      </div>
    </nav>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">
      {% block content %} {% endblock %}
    </main>

    <!-- FOOTER -->
    <footer>
      <div class="container">
        <p>
          <i class="fas fa-book"></i> &copy; 2026 - MyBooks - Todos os direitos reservados.
          <br>
          <small>Dados fornecidos pela <a href="https://openlibrary.org/" target="_blank">Open Library</a></small>
        </p>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
